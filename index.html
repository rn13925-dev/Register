<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>మన ఊరు యాప్ - లాగిన్ & కాల్</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1b5e20; }
        .call-btn { background-color: #d32f2f; margin-top: 15px; }
        .call-btn:hover { background-color: #b71c1c; }
        #dashboard, #otpSection { display: none; }
    </style>
</head>
<body>

    <!-- 1. లాగిన్ పేజీ -->
    <div id="loginPage" class="card">
        <h2>లాగిన్ అవ్వండి</h2>
        <p style="text-align:center; color:#555; font-size:14px;">మీ మొబైల్ నంబర్ ఎంటర్ చేయండి</p>
        
        <!-- ఫైర్‌బేస్ సెక్యూరిటీ కోసం -->
        <div id="recaptcha-container"></div>
        
        <input type="tel" id="mobileNumber" placeholder="నంబర్ ఎంటర్ చేయండి (ఉదా: 9014770191)">
        <button id="sendOtpBtn" onclick="sendOTP()">OTP పంపండి</button>

        <div id="otpSection">
            <input type="number" id="otpCode" placeholder="మీకు వచ్చిన 6-అంకెల OTP ఎంటర్ చేయండి">
            <button onclick="verifyOTP()">లాగిన్ కన్ఫర్మ్ చేయండి</button>
        </div>
    </div>

    <!-- 2. డ్యాష్‌బోర్డ్ (కాల్ పేజీ) -->
    <div id="dashboard" class="card">
        <h2>డ్యాష్‌బోర్డ్</h2>
        <p style="text-align:center; color:#333;">మీరు లాగిన్ అయిన నంబర్: <br><strong id="userNum" style="color:#2e7d32; font-size:18px;"></strong></p>
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        
        <h3 style="text-align:center;">కస్టమర్ కి కాల్ చేయండి</h3>
        <p style="text-align:center; color:#666; font-size:12px;">(మీ నంబర్ కస్టమర్‌కి కనిపించదు, +1 అమెరికా నంబర్ కనిపిస్తుంది)</p>
        
        <input type="tel" id="targetNumber" placeholder="కస్టమర్ మొబైల్ నంబర్ ఎంటర్ చేయండి">
        <button class="call-btn" onclick="makeMaskedCall()">📞 కాల్ చేయండి</button>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // మీ ఫైర్‌బేస్ కాన్ఫిగరేషన్
        const firebaseConfig = {
            apiKey: "AIzaSyBaC9WvzR6_98TqimcqwPiCwlDXliXkP30",
            authDomain: "vishnu-priya-finance.firebaseapp.com",
            projectId: "vishnu-priya-finance",
            storageBucket: "vishnu-priya-finance.firebasestorage.app",
            messagingSenderId: "917604826030",
            appId: "1:917604826030:web:94f30189210a2ea71ce63f",
            measurementId: "G-EVK56X0Z1Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.confirmationResult = null;
        let loggedInNumber = "";

        // 1. OTP పంపే ఫంక్షన్
        window.sendOTP = function() {
            let number = document.getElementById("mobileNumber").value.trim();
            
            // నంబర్ కి ఆటోమేటిక్ గా +91 యాడ్ చేయడం
            if (!number.startsWith("+")) {
                if(number.startsWith("91") && number.length === 12) {
                    number = "+" + number; 
                } else if(number.length === 10) {
                    number = "+91" + number; 
                }
            }

            if(number.length !== 13) {
                alert("దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ ఎంటర్ చేయండి.");
                return;
            }

            try {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
                
                signInWithPhoneNumber(auth, number, window.recaptchaVerifier)
                    .then((result) => {
                        window.confirmationResult = result;
                        document.getElementById("otpSection").style.display = "block";
                        document.getElementById("sendOtpBtn").style.display = "none";
                        document.getElementById("mobileNumber").disabled = true;
                        alert("OTP విజయవంతంగా పంపబడింది!");
                    }).catch((error) => {
                        alert("ఎర్రర్ కోడ్: " + error.code + " \n\nవివరాలు: " + error.message);
                    });
            } catch(e) {
                alert("కోడ్ లో ఎర్రర్: " + e.message);
            }
        }

        // 2. OTP వెరిఫై చేసే ఫంక్షన్
        window.verifyOTP = function() {
            const code = document.getElementById("otpCode").value;
            window.confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                loggedInNumber = user.phoneNumber;
                
                // లాగిన్ అయ్యాక డాష్‌బోర్డ్ చూపించడం
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                document.getElementById("userNum").innerText = loggedInNumber;
                
            }).catch((error) => {
                alert("మీరు ఎంటర్ చేసిన OTP తప్పు లేదా గడువు ముగిసింది!");
            });
        }

        // 3. Twilio ద్వారా కాల్ చేసే ఫంక్షన్
        window.makeMaskedCall = function() {
            let targetNum = document.getElementById("targetNumber").value.trim();
            
            if(targetNum === "") {
                alert("దయచేసి కస్టమర్ నంబర్ ఎంటర్ చేయండి");
                return;
            }

            // కస్టమర్ నంబర్ కి +91 యాడ్ చేయడం
            if (!targetNum.startsWith("+")) {
                if(targetNum.length === 10) {
                    targetNum = "+91" + targetNum;
                }
            }

            // మీ Twilio వివరాలు
            const twilioSid = "ACb00354afd6f370748eabf41f8736348f";
            const twilioToken = "6fb77fe685f1122e9e464c377872667e";
            const twilioNumber = "+17372212163";

            const callData = new URLSearchParams();
            callData.append("To", targetNum); 
            callData.append("From", twilioNumber); 
            callData.append("Url", "http://demo.twilio.com/docs/voice.xml"); // డెమో వాయిస్ లింక్

            alert("కాల్ కనెక్ట్ అవుతోంది... దయచేసి వేచి ఉండండి.");

            // Twilio సర్వర్ కి కాల్ రిక్వెస్ట్ పంపడం
            fetch("https://api.twilio.com/2010-04-01/Accounts/" + twilioSid + "/Calls.json", {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa(twilioSid + ':' + twilioToken),
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: callData
            })
            .then(response => response.json())
            .then(data => {
                if(data.error_message) {
                    alert("ఎర్రర్: " + data.error_message + "\n\n(గమనిక: ఫ్రీ అకౌంట్ కాబట్టి, ఈ నంబర్ Twilio 'Verified Caller IDs' లో యాడ్ చేసి ఉంటేనే కాల్ వెళుతుంది)");
                } else {
                    alert("కాల్ విజయవంతంగా వెళ్ళింది! \n\nకస్టమర్ కి మీ నంబర్ కనిపించదు.");
                }
            })
            .catch(error => {
                console.error(error);
                alert("కాల్ వెళ్లడంలో ఏదో సాంకేతిక లోపం జరిగింది.");
            });
        }
    </script>
</body>
</html>
